[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rr-pf"
version = "3.1.0"
description = "Exact rational numbers and rational enclosures, with a Fraction-based test oracle and a Lean 4 correspondence."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["rational", "interval arithmetic", "exact arithmetic", "testing", "lean4"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
