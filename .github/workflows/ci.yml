name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run pytest
        run: pytest -q

  lean:
    name: lake build + axiom audit (Lean v4.14.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lean package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true

      - name: Reject sorry in build output
        working-directory: lean
        run: |
          lake build 2>&1 | tee build.log
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "sorry found in build"; exit 1
          fi

      - name: Axiom audit
        working-directory: lean
        run: |
          lake env lean Check.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then
            echo "sorryAx found"; exit 1
          fi
          test "$(grep -c 'depends on axioms' axioms.txt)" -eq 22

      - name: Lean cases are up to date with the Python generator
        run: python3 tools/export_cases.py --check
